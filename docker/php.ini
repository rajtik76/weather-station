; Production PHP settings. The image is built once and gets its configuration
; from the environment, so opcache can assume the files never change.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
