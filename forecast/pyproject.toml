[project]
name = "weather-station-forecast"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pandas>=3.0.6", "scikit-learn>=1.9.1"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
train = ["pyarrow>=25.0.1"]

[tool.uv]
# train (parquet) stays out of the service image; dev (pytest) is requested with --group dev.
default-groups = ["train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Service modules sit beside pyproject.toml and import each other flat.
pythonpath = ["."]
