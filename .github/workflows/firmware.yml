name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump together with a local check.
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.12"
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  # Default 1.2 MB app slot is too small; OTA needs two slots.
  FQBN: esp32:esp32:esp32:PartitionScheme=min_spiffs

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Cache ESP32 core
        uses: actions/cache@v6
        with:
          path: ~/.arduino15/packages
          key: arduino-esp32-${{ env.ESP32_CORE_VERSION }}

      - name: Install core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "esp32:esp32@$ESP32_CORE_VERSION" --additional-urls "$ESP32_INDEX_URL"
          arduino-cli lib install \
            "Adafruit BMP280 Library@3.0.0" \
            "Adafruit SHT4x Library@1.0.5" \
            "Adafruit BusIO@1.17.4" \
            "Adafruit Unified Sensor@1.1.15" \
            "ArduinoJson@7.4.3"

      - name: Compile weather_station
        # secrets.h is gitignored; the placeholders build.
        run: |
          cp firmware/weather_station/secrets.example.h firmware/weather_station/secrets.h
          arduino-cli compile --fqbn "$FQBN" firmware/weather_station

      - name: Compile sensors_check
        run: arduino-cli compile --fqbn "$FQBN" firmware/sensors_check
