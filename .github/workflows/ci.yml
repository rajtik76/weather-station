name: CI

on:
  push:
    branches: [main]
    # The firmware is Arduino sources; nothing here builds or tests it.
    paths-ignore: ["firmware/**"]
  pull_request:
    paths-ignore: ["firmware/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, analyse, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, xml, tokenizer, fileinfo, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v7
        with:
          # Read from .node-version, so the runner and the local version
          # manager cannot drift apart.
          node-version-file: .node-version
          cache: npm

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build assets
        # The dashboard test renders the page, which needs the Vite manifest.
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      # The three steps below are what composer review runs locally, split up
      # so a failure names itself in the job list instead of hiding in one log.
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest
        run: php artisan test --parallel
