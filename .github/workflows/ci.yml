name: CI

on:
  push:
    branches: [main]
    # Nothing here builds or tests the firmware.
    paths-ignore: ["firmware/**"]
  pull_request:
    paths-ignore: ["firmware/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, analyse, test
    runs-on: ubuntu-latest

    # The dashboard's SQL is PostgreSQL only (generate_series, jsonb), so no SQLite.
    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: weather_station_test
          POSTGRES_USER: weather_station
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weather_station -d weather_station_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, xml, tokenizer, fileinfo, pdo_pgsql
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build assets
        # The dashboard test renders the page, which needs the Vite manifest.
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      # What composer review runs locally, split so a failure names itself.
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest
        run: php artisan test --parallel
